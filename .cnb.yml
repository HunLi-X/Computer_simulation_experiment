# 触发器：推送到主分支
main: #分支
  push: #有提交时
    - stages: #启动流水线
        - name: build knowledge base #名字
          image: cnbcool/knowledge-base #知识库插件
          settings: #知识库设置
            embedding_model: hunyuan #知识库使用的基础模型
            include: "**/**.md" #知识库包含的文件类型
    # 从私有仓库导入环境变量：
    # 参考：https://docs.cnb.cool/en/build/env.html#importing-environment-variables
    - imports: https://cnb.cool/1255027942/key/-/blob/main/envs.yml
      stages:
        # 将构建输出部署到 EdgeOne Pages
        # ./dist 目录由前一步构建步骤生成
        # 参考：https://www.npmjs.com/package/edgeone
        - name: Deploy to EdgeOne Pages
          image: tencentcom/deploy-eopages:latest
          script: edgeone pages deploy ./main -n newblog -t $EDGEONE_API_TOKEN